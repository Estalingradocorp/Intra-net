<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SkiFree Retro</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --ui-font: 'Courier New', Courier, monospace;
            --primary: #00d4ff; /* Añadido para la pantalla de carga */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: var(--ui-font);
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #e0f7fa 0%, #ffffff 100%);
            cursor: crosshair;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            z-index: 10;
            background: rgba(255, 255, 255, 0.75);
            padding: 15px 25px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(5px);
        }

        .ui-label {
            font-size: 13px;
            color: #444;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        
        .ui-value {
            font-size: 28px;
            font-weight: 900;
            color: #111;
        }

        .menu-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .title-card {
            text-align: center;
            margin-bottom: 20px;
        }

        .title-card h1 {
            font-size: 48px;
            margin: 0;
            color: #2b2d42;
            font-family: 'Orbitron', sans-serif;
        }

        .btn {
            padding: 15px 30px;
            font-size: 20px;
            font-family: var(--ui-font);
            cursor: pointer;
            background: #2b2d42;
            color: white;
            border: 4px solid #000;
            box-shadow: 4px 4px 0px #888;
            transition: all 0.1s;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #888;
            transform: translate(4px, 4px);
        }

        .btn-secondary {
            background-color: #4a5568 !important;
        }

        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 50;
            pointer-events: auto;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.1);
            border: 2px solid #000;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            user-select: none;
            touch-action: manipulation;
        }

        @media (min-width: 768px) {
            #mobile-controls { display: none; }
        }
        
        /* === Estilos Pantalla de Carga Avanzada === */
        .loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050505; z-index: 99999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.8s cubic-bezier(0.86, 0, 0.07, 1), visibility 0.8s, transform 0.8s cubic-bezier(0.86, 0, 0.07, 1);
            background-image: 
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }
        
        .loader-wrapper.hidden { 
            opacity: 0; 
            visibility: hidden; 
            transform: scale(1.05);
        }
        
        .loader-content {
            display: flex; flex-direction: column; align-items: center; position: relative;
        }

        .loader-logo-container {
            position: relative;
            width: 130px; height: 130px;
            margin-bottom: 35px;
            display: flex; justify-content: center; align-items: center;
        }
        
        .loader-logo {
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
            position: relative; z-index: 2;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            border: 2px solid var(--primary);
        }
        
        .loader-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 2px dashed rgba(0, 212, 255, 0.6);
            border-radius: 50%;
            animation: spinRing 6s linear infinite;
            z-index: 1;
        }
        .loader-ring::before {
            content: ''; position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 50%;
            animation: spinRing 4s linear infinite reverse;
        }
        @keyframes spinRing { 100% { transform: rotate(360deg); } }

        .loader-text {
            font-family: 'Orbitron', sans-serif;
            color: #fff; font-size: 1.3rem; font-weight: 700;
            letter-spacing: 4px; margin-bottom: 25px;
            text-transform: uppercase;
            animation: textGlow 2s ease-in-out infinite alternate;
        }
        @keyframes textGlow {
            0% { text-shadow: 0 0 5px rgba(0,212,255,0.3); }
            100% { text-shadow: 0 0 15px rgba(0,212,255,0.8), 0 0 25px rgba(0,212,255,0.5); }
        }

        .loader-progress {
            width: 280px; height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            position: relative; overflow: hidden;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
        .loader-progress-bar {
            position: absolute; top: 0; left: 0; height: 100%;
            background: var(--primary); width: 0%;
            box-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
            animation: fillProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes fillProgress {
            0% { width: 0%; }
            40% { width: 45%; }
            70% { width: 85%; }
            100% { width: 100%; }
        }

        .loader-status {
            margin-top: 15px; font-size: 0.85rem; color: var(--primary);
            font-family: 'Rajdhani', sans-serif; font-weight: 600;
            text-transform: uppercase; letter-spacing: 2px;
            animation: blinkStatus 1s infinite;
        }
        @keyframes blinkStatus { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

<!-- Pantalla de Carga Avanzada -->
<div id="loader" class="loader-wrapper">
    <div class="loader-content">
        <div class="loader-logo-container">
            <div class="loader-ring"></div>
            <img src="https://64.media.tumblr.com/b43e532856d9c41cf269d4fb70e21b6d/775bee4245596f43-19/s540x810/17c8b08a7fc9984523b866e3aafba1fe96262c95.jpg" alt="EC Game Logo" class="loader-logo">
        </div>
        <div class="loader-text">INICIANDO SISTEMA</div>
        <div class="loader-progress">
            <div class="loader-progress-bar"></div>
        </div>
        <div class="loader-status" id="loaderStatus">Cargando gráficos SVG...</div>
    </div>
</div>

<div id="game-container">
    <div id="ui-layer">
        <div><span class="ui-label">DISTANCIA</span><br><span class="ui-value" id="dist-val">0</span> <span style="font-size:16px;color:#888;">m</span></div>
        <div><span class="ui-label">VELOCIDAD</span><br><span class="ui-value" id="speed-val">0</span> <span style="font-size:16px;color:#888;">km/h</span></div>
    </div>

    <div id="menu" class="menu-overlay" style="display: none;">
        <div class="title-card">
            <h1>SkiFree</h1>
            <p>Esquiva los árboles. No dejes que el Yeti te atrape.</p>
        </div>
        <button class="btn" id="start-btn" onclick="startGame()">¡A ESQUIAR!</button>
        <button class="btn" id="resume-btn" onclick="resumeGame()" style="display: none; background-color: #00d4ff; color: #000;">CONTINUAR</button>
        <button class="btn btn-secondary" onclick="openSettings()" style="margin-top: 15px;">AJUSTES</button>
        <button class="btn btn-secondary" onclick="window.location.href='https://nicotips27.github.io/EC-Escritorio/'" style="margin-top: 15px;">Volver a EC Game</button>
        <button class="btn btn-secondary" onclick="window.location.href='index.html'" style="margin-top: 10px;">🏠 Portal Retro</button>
        <button class="btn btn-secondary" onclick="window.location.href='index2.html'" style="margin-top: 10px;">📚 data-wiki</button>
        <button class="btn btn-secondary" onclick="window.location.href='Buscador retro.html'" style="margin-top: 10px;">🔍 Buscador Retro</button>
        <button class="btn btn-secondary" onclick="window.location.href='K27.html'" style="margin-top: 10px;">🖥️ K27</button>
        <p style="margin-top: 20px; font-size: 12px;">Usa las FLECHAS para moverte | ESPACIO para saltar | ESC para pausar</p>
    </div>

    <div id="settings-menu" class="menu-overlay" style="display: none; z-index: 110;">
        <div class="title-card">
            <h1>AJUSTES</h1>
        </div>
        <div style="background: rgba(255,255,255,0.8); padding: 20px; border-radius: 10px; border: 2px solid var(--primary); margin-bottom: 20px; text-align: center; font-family: 'Orbitron', sans-serif;">
            <label style="font-size: 18px; font-weight: bold;">VOLUMEN: <span id="vol-val">100</span>%</label><br>
            <input type="range" id="volume-slider" min="0" max="100" value="100" oninput="updateVolume(this.value)" style="width: 250px; margin-top: 15px; cursor: pointer;">
        </div>
        <button class="btn" onclick="closeSettings()">VOLVER</button>
    </div>

    <div id="game-over" class="menu-overlay" style="display: none;">
        <div class="title-card">
            <h1 id="over-title">¡EL YETI TE COMIÓ!</h1>
            <p>Distancia recorrida: <span id="final-dist">0</span>m</p>
        </div>
        <button class="btn" onclick="startGame()">REINTENTAR</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls">
        <div class="control-btn" ontouchstart="handleInput('ArrowLeft')">←</div>
        <div class="control-btn" ontouchstart="handleInput('ArrowDown')">↓</div>
        <div class="control-btn" ontouchstart="handleInput('ArrowRight')">→</div>
        <div class="control-btn" ontouchstart="handleInput('Space')">JUMP</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const distEl = document.getElementById('dist-val');
    const speedEl = document.getElementById('speed-val');
    const menu = document.getElementById('menu');
    const gameOverScreen = document.getElementById('game-over');
    const loader = document.getElementById('loader');

    // Game Constants
    const SKIER_WIDTH = 40;
    const SKIER_HEIGHT = 40;
    const WORLD_WIDTH = 2000;
    const GRAVITY = 0.15;
    const YETI_SPAWN_DIST = 2000;

    let gameState = 'LOADING';
    let distance = 0;
    let cameraY = 0;
    let obstacles = [];
    
    let assetsLoaded = false;
    let animationDone = false;
    let particles = [];
    let snowflakes = [];
    
    const player = {
        x: 0,
        y: 100,
        vx: 0,
        vy: 0,
        angle: 0, 
        state: 'SKIING', 
        z: 0,
        vz: 0,
        speed: 0
    };

    const yeti = {
        x: 0,
        y: -500,
        active: false,
        state: 'CHASING',
        frame: 0
    };

    const teaserYeti = {
        x: 0,
        y: 0,
        vx: 0,
        active: false,
        done500: false,
        done1500: false,
        frame: 0
    };

    // --- SISTEMA DE SONIDO RETRO Y MÚSICA (Web Audio API) ---
    let audioCtx;
    let masterGain;
    let musicInterval = null;
    let nextNoteTime = 0;
    let currentNoteIndex = 0;
    let currentTheme = null;

    // Secuencias de notas (Frecuencia en Hz, Duración en segundos)
    const musicNotes = {
        menu: [ // Arpegio calmado y misterioso
            [261.63, 0.3], [329.63, 0.3], [392.00, 0.3], [523.25, 0.3],
            [392.00, 0.3], [329.63, 0.3]
        ],
        game: [ // Línea de bajo rápida estilo 8-bits
            [110.00, 0.15], [110.00, 0.15], [130.81, 0.15], [164.81, 0.15],
            [110.00, 0.15], [110.00, 0.15], [196.00, 0.15], [164.81, 0.15]
        ]
    };

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = audioCtx.createGain();
            masterGain.connect(audioCtx.destination);
            masterGain.gain.value = document.getElementById('volume-slider').value / 100;
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function scheduleMusic() {
        if (!currentTheme || !audioCtx) return;
        const sequence = musicNotes[currentTheme];
        
        // Planificamos las notas que deben sonar en los próximos 100ms
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            const [freq, duration] = sequence[currentNoteIndex];
            
            if (freq > 0) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Ondas cuadradas para el juego (acción), triangulares para el menú (suave)
                osc.type = currentTheme === 'menu' ? 'triangle' : 'square'; 
                osc.frequency.value = freq;
                
                osc.connect(gain);
                gain.connect(masterGain);
                
                // Control del volumen para que suene como notas separadas (ADSR básico)
                gain.gain.setValueAtTime(0.04, nextNoteTime);
                gain.gain.exponentialRampToValueAtTime(0.001, nextNoteTime + duration - 0.02);
                
                osc.start(nextNoteTime);
                osc.stop(nextNoteTime + duration);
            }
            
            nextNoteTime += duration;
            currentNoteIndex = (currentNoteIndex + 1) % sequence.length;
        }
    }

    function playMusic(theme) {
        if (!audioCtx) initAudio();
        stopMusic();
        currentTheme = theme;
        currentNoteIndex = 0;
        nextNoteTime = audioCtx.currentTime + 0.05;
        musicInterval = setInterval(scheduleMusic, 25);
    }

    function stopMusic() {
        if (musicInterval) clearInterval(musicInterval);
        currentTheme = null;
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        osc.connect(gainNode);
        gainNode.connect(masterGain);

        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.2);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'crash') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'roar') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.linearRampToValueAtTime(40, now + 1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.linearRampToValueAtTime(0.01, now + 1);
            osc.start(now);
            osc.stop(now + 1);
        } else if (type === 'bite') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gainNode.gain.setValueAtTime(0.3, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }
    // ---------------------------------------------------------

    // SVGs for Assets - HIGH QUALITY VECTORS
    const assets = {
        tree: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50"><rect x="17" y="40" width="6" height="10" fill="#4E342E"/><path d="M20 5 L5 25 H12 L2 45 H38 L28 25 H35 Z" fill="#2E7D32"/><path d="M20 5 L20 45 H38 L28 25 H35 Z" fill="#1B5E20"/><path d="M20 5 L12 15 H18 L10 25 H15 L6 35" stroke="#FFF" stroke-width="2" fill="none" opacity="0.9" stroke-linecap="round"/></svg>`,
        treeSmall: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 40"><rect x="13" y="32" width="4" height="8" fill="#4E342E"/><path d="M15 10 L5 32 H25 Z" fill="#4CAF50"/><path d="M15 10 L15 32 H25 Z" fill="#388E3C"/><path d="M15 10 L10 18 H15 L8 25" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.9" stroke-linecap="round"/></svg>`,
        rock: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 30"><path d="M5 25 Q10 10 20 12 T35 25 Z" fill="#9E9E9E"/><path d="M20 12 Q25 15 35 25 H20 Z" fill="#757575"/><path d="M15 11 Q20 12 25 14 Q22 8 15 11 Z" fill="#FFFFFF" opacity="0.8"/></svg>`,
        ramp: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 30"><path d="M5 25 L45 25 L45 10 Q25 20 5 25 Z" fill="#E3F2FD"/><path d="M5 25 L45 25 L45 20 Q25 22 5 25 Z" fill="#BBDEFB"/><path d="M45 10 L45 25 L50 25 L50 10 Z" fill="#90CAF9"/></svg>`,
        yeti0: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50"><rect x="10" y="15" width="30" height="25" rx="10" fill="#ECEFF1"/><rect x="25" y="15" width="15" height="25" rx="10" fill="#CFD8DC"/><circle cx="25" cy="15" r="12" fill="#ECEFF1"/><circle cx="20" cy="12" r="3" fill="#F44336"/><circle cx="30" cy="12" r="3" fill="#F44336"/><circle cx="20" cy="12" r="1" fill="#FFF"/><circle cx="30" cy="12" r="1" fill="#FFF"/><path d="M 20 20 Q 25 24 30 20" stroke="#000" stroke-width="2" fill="none"/><path d="M 22 20 L 23 23 L 24 20 M 26 20 L 27 23 L 28 20" fill="#FFF"/><path d="M 12 20 Q 0 10 5 5" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 38 20 Q 50 30 45 40" stroke="#CFD8DC" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 20 40 L 15 48" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round"/><path d="M 30 40 L 35 48" stroke="#CFD8DC" stroke-width="6" stroke-linecap="round"/></svg>`,
        yeti1: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50"><rect x="10" y="17" width="30" height="23" rx="10" fill="#ECEFF1"/><rect x="25" y="17" width="15" height="23" rx="10" fill="#CFD8DC"/><circle cx="25" cy="17" r="12" fill="#ECEFF1"/><circle cx="20" cy="14" r="3" fill="#F44336"/><circle cx="30" cy="14" r="3" fill="#F44336"/><circle cx="20" cy="14" r="1" fill="#FFF"/><circle cx="30" cy="14" r="1" fill="#FFF"/><path d="M 20 22 Q 25 26 30 22" stroke="#000" stroke-width="2" fill="none"/><path d="M 22 22 L 23 25 L 24 22 M 26 22 L 27 25 L 28 22" fill="#FFF"/><path d="M 12 22 Q 0 30 5 40" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 38 22 Q 50 10 45 5" stroke="#CFD8DC" stroke-width="6" stroke-linecap="round" fill="none"/><path d="M 20 40 L 25 48" stroke="#ECEFF1" stroke-width="6" stroke-linecap="round"/><path d="M 30 40 L 25 48" stroke="#CFD8DC" stroke-width="6" stroke-linecap="round"/></svg>`,
        skierDown: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M 12 10 L 12 35" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><path d="M 28 10 L 28 35" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><path d="M 12 10 L 12 35" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/><path d="M 28 10 L 28 35" stroke="#FFA000" stroke-width="2" stroke-linecap="round"/><path d="M 5 15 L 5 30" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/><path d="M 35 15 L 35 30" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/><circle cx="5" cy="30" r="2" fill="#424242"/><circle cx="35" cy="30" r="2" fill="#424242"/><rect x="15" y="16" width="10" height="12" rx="3" fill="#E53935"/><rect x="20" y="16" width="5" height="12" rx="3" fill="#D32F2F"/><rect x="15" y="28" width="4" height="6" fill="#1E88E5"/><rect x="21" y="28" width="4" height="6" fill="#1565C0"/><path d="M 15 18 L 5 15" stroke="#E53935" stroke-width="4" stroke-linecap="round"/><path d="M 25 18 L 35 15" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="12" r="6" fill="#FFB74D"/><path d="M 14 12 A 6 6 0 0 1 26 12 Z" fill="#212121"/><rect x="16" y="10" width="8" height="4" rx="2" fill="#FF9800"/><rect x="16" y="10" width="8" height="2" rx="1" fill="#FFE082"/></svg>`,
        skierLeft: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M 30 5 L 10 35" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><path d="M 35 10 L 15 40" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><g transform="rotate(-30 20 20)"><rect x="15" y="16" width="10" height="12" rx="3" fill="#E53935"/><rect x="15" y="28" width="4" height="6" fill="#1E88E5"/><rect x="21" y="28" width="4" height="6" fill="#1565C0"/><path d="M 15 18 L 5 25" stroke="#E53935" stroke-width="4" stroke-linecap="round"/><path d="M 25 18 L 15 25" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="12" r="6" fill="#FFB74D"/><path d="M 14 12 A 6 6 0 0 1 26 12 Z" fill="#212121"/><rect x="15" y="10" width="6" height="4" rx="2" fill="#FF9800"/></g><path d="M 15 25 L 5 35" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/></svg>`,
        skierRight: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M 10 5 L 30 35" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><path d="M 5 10 L 25 40" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><g transform="rotate(30 20 20)"><rect x="15" y="16" width="10" height="12" rx="3" fill="#E53935"/><rect x="15" y="28" width="4" height="6" fill="#1E88E5"/><rect x="21" y="28" width="4" height="6" fill="#1565C0"/><path d="M 25 18 L 35 25" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/><path d="M 15 18 L 25 25" stroke="#E53935" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="12" r="6" fill="#FFB74D"/><path d="M 14 12 A 6 6 0 0 1 26 12 Z" fill="#212121"/><rect x="19" y="10" width="6" height="4" rx="2" fill="#FF9800"/></g><path d="M 25 25 L 35 35" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/></svg>`,
        skierCrash: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><path d="M 10 10 L 30 30 M 10 30 L 30 10" stroke="#FFC107" stroke-width="4" stroke-linecap="round"/><path d="M 5 20 L 15 25 M 35 20 L 25 25" stroke="#9E9E9E" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="20" r="10" fill="#E53935"/><circle cx="20" cy="20" r="4" fill="#FFB74D"/><path d="M 18 19 L 22 21 M 18 21 L 22 19" stroke="#000" stroke-width="1"/><path d="M 15 5 L 17 9 L 21 11 L 17 13 L 15 17 L 13 13 L 9 11 L 13 9 Z" fill="#FFEB3B"/></svg>`
    };

    const imgAssets = {};
    let assetsToLoad = Object.keys(assets).length;

    // Control de inicio del juego cuando todo está listo (Animación + Assets)
    function checkGameReady() {
        if (assetsLoaded && animationDone) {
            if(loader) loader.style.display = 'none';
            menu.style.display = 'flex';
            gameState = 'MENU';
            resize();
            draw(); 
        }
    }

    // Lógica de carga avanzada visual
    window.addEventListener('load', function() {
        const statusTexts = ["Cargando gráficos SVG...", "Estableciendo física...", "Preparando al Yeti...", "Acceso Concedido."];
        const statusEl = document.getElementById('loaderStatus');
        let idx = 0;
        
        const textInterval = setInterval(() => {
            if(idx < statusTexts.length) {
                statusEl.innerText = statusTexts[idx];
                idx++;
            }
        }, 450);

        setTimeout(() => {
            clearInterval(textInterval);
            if(loader) loader.classList.add('hidden');
            
            // Esperar a que termine la transición CSS de 0.8s
            setTimeout(() => {
                animationDone = true;
                checkGameReady();
            }, 800);
        }, 1800); // 1.8 segundos de animación de carga
    });

    function initAssets() {
        Object.entries(assets).forEach(([key, svg]) => {
            const img = new Image();
            img.onload = () => {
                assetsToLoad--;
                if (assetsToLoad === 0) {
                    assetsLoaded = true;
                    checkGameReady();
                }
            };
            img.onerror = () => {
                console.error("Failed to load asset:", key);
                assetsToLoad--; 
                if (assetsToLoad === 0) {
                    assetsLoaded = true;
                    checkGameReady();
                }
            };
            img.src = 'data:image/svg+xml;base64,' + btoa(svg);
            imgAssets[key] = img;
        });
    }

    function initSnowflakes() {
        snowflakes = [];
        for(let i=0; i<150; i++) {
            snowflakes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                r: Math.random() * 2 + 0.5,
                vx: (Math.random() - 0.5) * 1.5,
                vy: Math.random() * 2 + 1
            });
        }
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        if (gameState === 'MENU' || gameState === 'LOADING') {
            player.x = canvas.width / 2;
        }
        initSnowflakes();
    }

    window.addEventListener('resize', resize);

    function startGame() {
        initAudio(); // Iniciar contexto de audio con la interacción del usuario
        playMusic('game'); // Iniciar la música de juego retro
        gameState = 'PLAYING';
        document.getElementById('start-btn').innerText = 'NUEVA PARTIDA';
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('resume-btn').style.display = 'none';
        menu.style.display = 'none';
        gameOverScreen.style.display = 'none';
        distance = 0;
        cameraY = 0;
        obstacles = [];
        particles = [];
        player.x = canvas.width / 2;
        player.y = 100;
        player.vx = 0;
        player.vy = 0;
        player.z = 0;
        player.vz = 0;
        player.state = 'SKIING';
        player.angle = 0;
        yeti.active = false;
        yeti.y = -500;
        yeti.state = 'CHASING';
        
        teaserYeti.active = false;
        teaserYeti.done500 = false;
        teaserYeti.done1500 = false;
        
        for(let i=0; i<20; i++) {
            spawnObstacle(Math.random() * canvas.height + 200);
        }
    }

    function pauseGame() {
        if (gameState !== 'PLAYING') return;
        gameState = 'PAUSED';
        stopMusic();
        document.getElementById('resume-btn').style.display = 'block';
        menu.style.display = 'flex';
    }

    function resumeGame() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        playMusic('game');
        gameState = 'PLAYING';
        menu.style.display = 'none';
        document.getElementById('settings-menu').style.display = 'none';
    }

    function openSettings() {
        menu.style.display = 'none';
        document.getElementById('settings-menu').style.display = 'flex';
    }

    function closeSettings() {
        document.getElementById('settings-menu').style.display = 'none';
        menu.style.display = 'flex';
    }

    function updateVolume(val) {
        document.getElementById('vol-val').innerText = val;
        if (masterGain) {
            masterGain.gain.value = val / 100;
        }
    }

    const keys = {};
    window.addEventListener('keydown', e => {
        keys[e.code] = true;
        
        // Manejar el botón de escape (Pausa y Menús)
        if (e.code === 'Escape') {
            if (gameState === 'PLAYING') {
                pauseGame();
            } else if (gameState === 'PAUSED') {
                if (document.getElementById('settings-menu').style.display === 'flex') {
                    closeSettings();
                } else {
                    resumeGame();
                }
            }
        }
        
        if(e.code === 'Space' && player.state === 'SKIING' && player.z === 0 && gameState === 'PLAYING') {
            player.vz = 4;
            player.state = 'JUMPING';
            playSound('jump');
        }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    function handleInput(code) {
        if (gameState !== 'PLAYING') return; // Evita moverse si el juego está en pausa
        if (code === 'ArrowLeft') player.angle = -1;
        if (code === 'ArrowRight') player.angle = 1;
        if (code === 'ArrowDown') player.angle = 0;
        if (code === 'Space' && player.z === 0) {
            player.vz = 4;
            player.state = 'JUMPING';
            playSound('jump');
        }
    }

    function spawnObstacle(yPos) {
        const types = ['tree', 'treeSmall', 'rock', 'ramp'];
        const type = types[Math.floor(Math.random() * types.length)];
        
        let w = 30, h = 30;
        if(type === 'tree') { w = 40; h = 50; }
        else if(type === 'treeSmall') { w = 30; h = 40; }
        else if(type === 'rock') { w = 40; h = 30; }
        else if(type === 'ramp') { w = 50; h = 30; }

        obstacles.push({
            x: Math.random() * canvas.width,
            y: yPos || cameraY + canvas.height + 50,
            type: type,
            width: w,
            height: h
        });
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        if (keys['ArrowLeft']) player.angle = -1;
        else if (keys['ArrowRight']) player.angle = 1;
        else if (keys['ArrowDown']) player.angle = 0;
        else if (keys['ArrowUp']) player.angle = 2;

        if (player.state === 'SKIING' || player.state === 'JUMPING') {
            if (player.angle === -1) player.vx = -5; // Movimiento lateral más rápido (antes -3)
            else if (player.angle === 1) player.vx = 5; // Movimiento lateral más rápido (antes 3)
            else if (player.angle === 2) player.vx = 0;
            else player.vx *= 0.95;

            let targetVy = 0;
            if (player.angle === 0) targetVy = 8; // Velocidad hacia abajo MUCHO mayor (antes 5)
            else if (Math.abs(player.angle) === 1) targetVy = 5; // Velocidad diagonal mayor (antes 3)
            else if (player.angle === 2) targetVy = 0;

            player.vy += (targetVy - player.vy) * 0.1;
            
            if (player.z > 0 || player.vz !== 0) {
                player.z += player.vz;
                player.vz -= GRAVITY;
                if (player.z <= 0) {
                    player.z = 0;
                    player.vz = 0;
                    if (player.state === 'JUMPING') player.state = 'SKIING';
                }
            }

            player.x += player.vx;
            player.y += player.vy;
            distance += player.vy / 10;
        } else if (player.state === 'CRASHED') {
            player.vy *= 0.9;
            player.vx *= 0.9;
            player.y += player.vy;
            if (Math.abs(player.vy) < 0.2) {
                setTimeout(() => { if(player.state === 'CRASHED') player.state = 'SKIING'; }, 1000);
            }
        }

        // Sistema de Partículas: Rastro en la nieve
        if (player.state === 'SKIING' && (Math.abs(player.vx) > 0.1 || player.vy > 1)) {
            particles.push({
                x: player.x + (Math.random() - 0.5) * 20,
                y: player.y + 15, 
                vx: -player.vx * 0.2 + (Math.random() - 0.5),
                vy: -player.vy * 0.2 + (Math.random() - 0.5),
                life: 1.0
            });
        }
        
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.03;
        });
        particles = particles.filter(p => p.life > 0);

        // Copos de Nieve (Fondo y Ambiente)
        snowflakes.forEach(s => {
            s.y += s.vy;
            s.x += s.vx;
            if(s.y > canvas.height) {
                s.y = 0;
                s.x = Math.random() * canvas.width;
            }
            if(s.x > canvas.width) s.x = 0;
            else if(s.x < 0) s.x = canvas.width;
        });

        cameraY = player.y - 150;

        if (Math.random() < 0.05) spawnObstacle();
        obstacles = obstacles.filter(o => o.y > cameraY - 100);

        if (player.z < 5) {
            obstacles.forEach(o => {
                const dx = player.x - o.x;
                const dy = (player.y + 10) - o.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 20) {
                    if (o.type === 'ramp' && player.state !== 'JUMPING') {
                        player.vz = 6;
                        player.state = 'JUMPING';
                        playSound('jump');
                    } else if (o.type !== 'ramp' && player.state !== 'JUMPING') {
                        if (player.state !== 'CRASHED') playSound('crash'); // Sonido de choque
                        player.state = 'CRASHED';
                        player.vy = -2;
                    }
                }
            });
        }

        // --- CAMEOS DEL YETI (500m y 1500m) ---
        const triggerTeaser = () => {
            teaserYeti.active = true;
            const fromLeft = Math.random() > 0.5;
            teaserYeti.x = fromLeft ? -100 : canvas.width + 100;
            // Aparece un poco por delante o detrás del jugador
            teaserYeti.y = player.y + (Math.random() * 200 - 50); 
            teaserYeti.vx = fromLeft ? 8 : -8; // Corre muy rápido
            playSound('roar'); // Asusta al jugador con el gruñido
        };

        if (distance >= 500 && !teaserYeti.done500 && !teaserYeti.active) {
            teaserYeti.done500 = true;
            triggerTeaser();
        }

        if (distance >= 1500 && !teaserYeti.done1500 && !teaserYeti.active) {
            teaserYeti.done1500 = true;
            triggerTeaser();
        }

        if (teaserYeti.active) {
            teaserYeti.x += teaserYeti.vx;
            teaserYeti.frame = Math.floor(Date.now() / 150) % 2;
            
            // Terminar cameo si sale de la pantalla
            if ((teaserYeti.vx > 0 && teaserYeti.x > canvas.width + 100) || 
                (teaserYeti.vx < 0 && teaserYeti.x < -100)) {
                teaserYeti.active = false;
            }
        }

        // --- FIX: El Yeti aparece cerca del jugador en vez de en el inicio ---
        if (distance > YETI_SPAWN_DIST && !yeti.active) {
            yeti.active = true;
            yeti.x = player.x + (Math.random() > 0.5 ? 300 : -300); // Aparece a la izquierda o derecha
            yeti.y = cameraY - 100; // Aparece un poco más arriba del borde superior de la pantalla
            playSound('roar'); // Sonido del Yeti despertando
        }

        if (yeti.active && yeti.state === 'CHASING') {
            const dx = player.x - yeti.x;
            const dy = player.y - yeti.y;
            const angle = Math.atan2(dy, dx);
            const speed = 9.5; // Velocidad del Yeti aumentada para que siga siendo una amenaza (antes 6.5)
            yeti.vx = Math.cos(angle) * speed;
            yeti.vy = Math.sin(angle) * speed;
            yeti.x += yeti.vx;
            yeti.y += yeti.vy;
            yeti.frame = Math.floor(Date.now() / 200) % 2;

            const distToPlayer = Math.sqrt(dx*dx + dy*dy);
            if (distToPlayer < 20) {
                if (yeti.state !== 'EATING') {
                    playSound('bite'); // Sonido de comer
                    stopMusic(); // Cortar la música de acción al ser devorado
                }
                yeti.state = 'EATING';
                player.state = 'EATEN';
                setTimeout(endGame, 2000);
            }
        }

        distEl.innerText = Math.floor(distance);
        speedEl.innerText = (player.vy * 2).toFixed(1);
    }

    function endGame() {
        gameState = 'GAMEOVER';
        playMusic('menu'); // Iniciar la música melancólica de Game Over / Menú
        gameOverScreen.style.display = 'flex';
        document.getElementById('final-dist').innerText = Math.floor(distance);
    }

    function safeDrawImage(img, x, y, w, h) {
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, x, y, w, h);
        }
    }

    function draw() {
        if (gameState === 'LOADING') return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar Copos de Nieve
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        snowflakes.forEach(s => {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fill();
        });

        // Dibujar Rastro de Esquí
        particles.forEach(p => {
            ctx.fillStyle = `rgba(224, 247, 250, ${p.life})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y - cameraY, 3 + (1 - p.life) * 6, 0, Math.PI * 2);
            ctx.fill();
        });

        // Pseudo-3D Z-sorting (Orden de profundidad)
        let renderList = [...obstacles];
        
        if (yeti.active) {
            renderList.push({ isYeti: true, x: yeti.x, y: yeti.y, frame: yeti.frame });
        }

        if (teaserYeti.active) {
            renderList.push({ isTeaserYeti: true, x: teaserYeti.x, y: teaserYeti.y, frame: teaserYeti.frame });
        }
        
        if (player.state !== 'EATEN') {
            renderList.push({ isPlayer: true, x: player.x, y: player.y, z: player.z });
        }

        // Ordenar por el eje Y
        renderList.sort((a, b) => a.y - b.y);

        renderList.forEach(item => {
            if (item.isPlayer) {
                let skierImg = imgAssets.skierDown;
                if (player.state === 'CRASHED') skierImg = imgAssets.skierCrash;
                else if (player.angle === -1) skierImg = imgAssets.skierLeft;
                else if (player.angle === 1) skierImg = imgAssets.skierRight;
                else if (player.angle === 2) skierImg = imgAssets.skierRight;

                const jumpScale = 1 + (player.z / 50);
                const w = SKIER_WIDTH * jumpScale;
                const h = SKIER_HEIGHT * jumpScale;

                // Sombra de salto
                if (player.z > 0) {
                    ctx.fillStyle = 'rgba(0,0,0,0.1)';
                    ctx.beginPath();
                    ctx.ellipse(player.x, player.y - cameraY + 15, 10 + (player.z/5), 5 + (player.z/10), 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                safeDrawImage(skierImg, player.x - w/2, (player.y - cameraY - h/2) - player.z, w, h);
            } 
            else if (item.isYeti) {
                const yetiImg = item.frame === 0 ? imgAssets.yeti0 : imgAssets.yeti1;
                safeDrawImage(yetiImg, item.x - 25, item.y - cameraY - 25, 50, 50);
            } 
            else if (item.isTeaserYeti) {
                const yetiImg = item.frame === 0 ? imgAssets.yeti0 : imgAssets.yeti1;
                // Si corre hacia la izquierda, invertimos la imagen horizontalmente para que mire a donde va
                if (teaserYeti.vx < 0) {
                    ctx.save();
                    ctx.scale(-1, 1);
                    safeDrawImage(yetiImg, -item.x - 25, item.y - cameraY - 25, 50, 50);
                    ctx.restore();
                } else {
                    safeDrawImage(yetiImg, item.x - 25, item.y - cameraY - 25, 50, 50);
                }
            }
            else {
                // Dibujar Obstáculos ajustando su base
                safeDrawImage(imgAssets[item.type], item.x - item.width/2, item.y - cameraY - item.height + 15, item.width, item.height);
            }
        });

        // Alerta visual de YETI aproximándose
        if (YETI_SPAWN_DIST - distance < 100 && distance < YETI_SPAWN_DIST) {
            ctx.fillStyle = "rgba(255, 0, 0, 0.1)";
            ctx.fillRect(0, (YETI_SPAWN_DIST * 10) - cameraY, canvas.width, 50);
        }

        requestAnimationFrame(() => {
            update();
            draw();
        });
    }

    initAssets();

</script>
